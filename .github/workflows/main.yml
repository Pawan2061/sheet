name: ci for docs fullstack

on:
  push:
    branches:
      - main

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Setup Node.js for web
        uses: actions/setup-node@v1
        with:
          node-version: "22"

      - name: login in to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCS_USERNAME }}
          password: ${{ secrets.DOCS_PASSWORD }}

      - name: push to dockerhub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Docker/react/Dockerfile.react
          push: true
          tags: pawan063/tiptapfrontend

  api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
      - name: Setup Node.js for web
        uses: actions/setup-node@v1
        with:
          node-version: "22"
      - name: login in to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCS_USERNAME }}
          password: ${{ secrets.DOCS_PASSWORD }}

      - name: push to dockerhub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Docker/backend/Dockerfile.react
          push: true
          tags: pawan063/tiptapbackend

  ws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Setup Node.js for web
        uses: actions/setup-node@v1
        with:
          node-version: "22"
      - name: login in to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCS_USERNAME }}
          password: ${{ secrets.DOCS_PASSWORD }}

      - name: push to dockerhub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Docker/ws/Dockerfile.ws
          push: true
          tags: pawan063/tiptapws
